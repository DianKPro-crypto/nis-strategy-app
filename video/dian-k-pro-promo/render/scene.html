/* Logo : plan texturé, relief tiré de la luminance, éclairage spéculaire or */
const logoVS = `varying vec2 vUv; varying vec3 vW, vNw, vTw, vBw; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;

const logoFS = `
uniform sampler2D map; uniform vec4 crop; uniform vec3 lightPos; uniform float sweep, opacity, full, glow;
uniform vec4 rev; uniform float revTag; uniform vec2 texel; varying vec2 vUv; varying vec3 vW, vNw, vTw, vBw;
uniform sampler2D envMap; uniform float envRot;
vec3 envLook(vec3 d){ float u = atan(d.z, d.x) / 6.2831853 + .5 + envRot; float v = asin(clamp(d.y, -1., 1.)) / 3.1415927 + .5; return texture2D(envMap, vec2(fract(u), v)).rgb; }
float lum(vec2 p){ return dot(texture2D(map,p).rgb, vec3(.3,.59,.11)); }
void main(){
  vec2 uv = mix(crop.xy, crop.zw, vUv);
  vec3 c = texture2D(map, uv).rgb;
  float h = lum(uv);
  float hx = lum(uv+vec2(texel.x,0.)) - lum(uv-vec2(texel.x,0.));
  float hy = lum(uv+vec2(0.,texel.y)) - lum(uv-vec2(0.,texel.y));
  vec3 n = normalize(vec3(-hx*3.6, -hy*3.6, 1.));
  vec3 Ld = normalize(lightPos - vW); vec3 V = normalize(cameraPosition - vW);

    m += step(.712,y)*(1.-step(.757,y)) * (1.-smoothstep(rev.z*1.15-.08, rev.z*1.15, x));
    m += step(.757,y)*(1.-step(.828,y)) * (1.-smoothstep(rev.w*.55-.04, rev.w*.55, abs(x-.5)));

/* Carte HDRI « studio » générée : fond sombre, softbox principale, bande latérale, plafonnier, contre-jour */
function makeStudioHDRI() {

  x.fillStyle = '#040404'; x.fillRect(0, 0, 1024, 512);
  const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, 'rgba(60,56,50,.5)'); g.addColorStop(.5, 'rgba(20,19,17,.4)'); g.addColorStop(1, 'rgba(0,0,0,0)');

        glowDot(x, y, (3 + 6 * p.s) * S, (.25 + .6 * p.a) * em * (.6 + .4 * Math.sin(t * 2 + p.ph))); });
      g2.globalCompositeOperation = 'source-over'; }
    // textes
    const cv = 1 - sm(.95, 1.4, t);
    show(E.coverKick, cv); show(E.coverTitle, cv); show(E.coverRole, cv);
    show(E.name, win(t, 3.0, 8.4, .7, .5), 24); show(E.role, win(t, 3.4, 8.3, .7, .5), 24);
    show(E.s1b, win(t, 10.0 + DA * .5, 12.6 + DA, .6, .5), 24); show(E.s1c, win(t, 9.3 + DA * .5, 12.7 + DA, .7, .5), 24);
  } else { [E.coverKick, E.coverTitle, E.coverRole, E.name, E.role, E.s1b, E.s1c].forEach(e => show(e, 0)); }

  /* --- 2a : globe --- */
  if (t > 12.9 + DA && t < T.s2b + .7) {
    globeOuter.visible = true;
    const inA = ease(sm(12.9 + DA, 14.1 + DA, t)), out = sm(T.s2b - .3, T.s2b + .6, t);
    const gx0 = VERT ? 0 : -visW * .14, gy0 = VERT ? visH * .14 : 0;
    globeOuter.position.set(lerp(gx0, VERT ? 0 : -visW * .6, ease(out)), lerp(gy0, VERT ? visH * .7 : gy0, ease(out) * (VERT ? 1 : 0)), 0);
    globeOuter.scale.setScalar(lerp(.25, 1, inA));
    globeMat.uniforms.opacity.value = inA * (1 - out);
    const lon = lerp(-55, 28, ease(sm(13.2 + DA, T.s2b, t)));
    const v = ll2v(10, lon, 1); globeSpin.rotation.y = Math.atan2(-v.x, v.z);
    globeOuter.rotation.x = 12 * Math.PI / 180;
    const t0 = 14.2 + DA, step = (T.s2b - .9 - t0) / 40;
    const litA = c => sm(t0 + c.k * step, t0 + c.k * step + .35, t);
    drawGlobeTex(c => litA(c) * (1 - out));
    countries.forEach(c => { if (!c.arc) return; const p = sm(t0 + c.k * step - .3, t0 + c.k * step + .1, t);
      c.arc.geometry.setDrawRange(0, Math.floor(p * 64) * 36); c.arc.material.opacity = .9 * (1 - out); });
    // halo
    const [cx, cy] = project(globeOuter.position);
    const rad = (VERT ? .42 * W : .37 * H) * globeOuter.scale.x;
    const hg = g2.createRadialGradient(cx, cy, rad * .9, cx, cy, rad * 1.5); hg.addColorStop(0, `rgba(212,164,76,${.12 * inA * (1 - out)})`); hg.addColorStop(1, 'rgba(0,0,0,0)');
    g2.fillStyle = hg; g2.fillRect(0, 0, W, H);
    const n = countries.filter(c => litA(c) > .5).length;
    E.count.innerHTML = `${n} <span style="font-size:.42em">${L.countries}</span>`;
    show(E.years, win(t, 14.0 + DA, T.s2b + .1, .6, .4), 30); show(E.count, win(t, 14.3 + DA, T.s2b + .1, .6, .4), 30);
    show(E.partners, win(t, 15.6 + DA, T.s2b + .1, .6, .4), 20); show(E.continents, win(t, 16.4 + DA, T.s2b + .1, .6, .4), 20);
  } else { [E.years, E.count, E.partners, E.continents].forEach(e => show(e, 0)); }

  /* --- 2b (9:16) : trois écrans empilés verticalement --- */
  if (VERT && t > T.s2b - .6 && t < T.s3 + .5) {
    stack.visible = true;
    const { SH, ys } = stack.userData, cues = [T.pc[0], T.pc[2], T.pc[4]];
    const outB = sm(T.s3 - .45, T.s3 + .25, t);
    camera.position.set(.08 * Math.sin(t * .5), .06 * Math.cos(t * .4), D - .3 * sm(T.s2b, T.s3, t)); camera.lookAt(0, 0, 0); camera.updateMatrixWorld();
    let active = 0; cues.forEach((c, i) => { if (t >= c - .1) active = i; });
    stack.children.forEach((g, i) => {
      const inn = ease(sm(cues[i] - .75, cues[i] - .05, t));
      const foc = 1 - Math.min(1, Math.abs(i - active));
      g.position.set(lerp(visW * 1.1, 0, inn), ys[i], 0);
      g.rotation.y = lerp(-.7, 0, inn);
      g.scale.setScalar(1 + .035 * foc * inn);
      const o = inn * (1 - outB);
      g.userData.scr.material.opacity = o * (.62 + .38 * foc);
      g.userData.frame.material.opacity = o * (.45 + .55 * foc);
      const [, yb] = project(new THREE.Vector3(0, ys[i] - SH / 2 * g.scale.y, 0));
      const lab = E.stackL[i]; lab.style.top = (yb - lab.offsetHeight - 2 * S) + 'px';
      show(lab, sm(cues[i] - .2, cues[i] + .25, t) * (1 - outB) * (.7 + .3 * foc), 0);
    });
    g2.globalCompositeOperation = 'lighter';
    PART.slice(0, 90).forEach(p => glowDot(((p.x + t * .01 * p.sp) % 1) * W, p.y * H, 3 * S, .22 * p.a * (1 - outB)));
    g2.globalCompositeOperation = 'source-over';
    show(E.pTitle, 0); show(E.pUrl, 0);
  } else if (VERT && E.stackL) { E.stackL.forEach(l => show(l, 0)); }

  /* --- 2b (16:9) : carrousel des plateformes --- */
  if (!VERT && t > T.s2b - .6 && t < T.s3 + .5) {
    panels.visible = true;
    const inB = ease(sm(T.s2b - .6, T.s2b + .5, t)), outB = sm(T.s3 - .45, T.s3 + .25, t);
    let f = -(1 - inB) * 1.3;
    for (let i = 1; i < NP; i++) f += ease(sm(T.pc[i] - .55, T.pc[i] - .02, t));
    panels.rotation.y = -f * STEP;
    const front = clamp(Math.round(f), 0, NP - 1);
    camera.position.set(0, VERT ? .15 : .55, lerp(15, VERT ? 7.4 : 8.6, inB) - .25 * Math.sin(t * .9));
    camera.lookAt(0, 0, 0);
    panels.children.forEach((g, i) => {
      const c = Math.cos((i - f) * STEP);                    // 1 = de face, -1 = à l'arrière
      const o = (1 - outB) * inB * clamp((c + .35) / 1.35);
      g.userData.scr.material.opacity = o * (.30 + .70 * Math.pow(clamp(c), 3));
      g.userData.frame.material.opacity = o * (.2 + .6 * Math.pow(clamp(c), 3));
    });
    const ti = clamp(1 - Math.abs(f - front) * 4) * (1 - outB) * sm(T.s2b - .1, T.s2b + .4, t);
    E.pTitle.innerHTML = L.p[front][0]; E.pUrl.innerHTML = L.p[front][1];
    show(E.pTitle, ti, 0); show(E.pUrl, ti, 0);
    g2.globalCompositeOperation = 'lighter';
    PART.slice(0, 120).forEach(p => glowDot(((p.x + t * .01 * p.sp) % 1) * W, p.y * H, 3 * S, .25 * p.a * inB * (1 - outB)));
    g2.globalCompositeOperation = 'source-over';
  } else if (!VERT) { show(E.pTitle, 0); show(E.pUrl, 0); }

  /* --- 3 : data science et IA --- */
  const a3 = sm(T.s3 - .3, T.s3 + .4, t) * (1 - sm(T.s4 - .1, T.s4 + .3, t));
  scene3(t, a3);
  const kwT = T.kw;
  E.kw.forEach((e, i) => show(e, win(t, kwT[i], kwT[i + 1] + .05, .3, .3) * (t < T.s4 + .2 ? 1 : 0), 26));

  /* --- 4 : logo complet --- */
  if (t >= T.s4 - .2) {
    logo.visible = true; lu.full.value = 1;
    const hFull = VERT ? visW * .95 / 1.184 : visH * .78;
    setCrop(CROP_FULL, hFull);
    const k = t - T.s4;
    logo.position.set(0, VERT ? visH * .06 : visH * .07, 0);
    const arc = ease(sm(0, 4.8, k));
    logo.rotation.y = lerp(.42, 0, arc) + .025 * Math.sin(k * .5) * arc;
    camera.position.set(lerp(1.2, 0, arc), lerp(-.2, 0, arc), lerp(8.4, D, arc)); camera.lookAt(0, logo.position.y * (1 - arc), 0);
    lu.rev.value.set(ease(sm(0, 1.1, k)), sm(.8, 1.9, k), sm(1.6, 2.4, k), sm(2.2, 3.0, k));
    lu.revTag.value = sm(T.tag, T.tag + 1.5, k);
    lu.opacity.value = sm(-.2, .5, k);
    lu.lightPos.value.set(lerp(-4, 2, sm(0, 8, k)), 3, 4);
    lu.sweep.value = k < 6 ? -.3 + (k - 4.4) * .9 : -.3 + ((k - 6.6) % 4.2) * .8;
    lu.glow.value = .25 + .2 * Math.sin(k * 1.4);
    lu.envRot.value = lerp(-.08, 0, arc) + .035 * Math.sin(k * .45);
    rays(t, sm(0, 2, k) * .9);
    // étincelles
    g2.globalCompositeOperation = 'lighter';
    const r5 = rnd(5);
    for (let i = 0; i < 40; i++) { const x = r5() * W, y = r5() * H, ph = r5() * 6.3, s = (1 + r5() * 2) * S * 3, aa = Math.max(0, Math.sin(k * 1.3 + ph));
      if (aa > .25) glowDot(x, y, s * 3 * aa, .55 * aa * sm(1, 3, k)); }
    const flash = Math.exp(-Math.pow((k - .05) * 3.2, 2)); if (k > -.2) glowDot(W / 2, H * .42, Math.max(W, H) * .6, .55 * flash);
    g2.globalCompositeOperation = 'source-over';
    show(E.cta, sm(T.cta, T.cta + .8, k), 20); show(E.sites, sm(T.cta + .5, T.cta + 1.3, k), 20);
  } else { show(E.cta, 0); show(E.sites, 0); }

  renderer.render(scene, camera);
  return true;
};

/* ---------- Chargement ---------- */
window.ready = (async () => {
  await document.fonts.load('600 40px Playfair'); await document.fonts.load('600 40px Inter'); await document.fonts.load('500 40px Inter'); await document.fonts.load('400 40px Inter');
  await document.fonts.ready;
  logoTex = await loadTex('../assets/logo_dk.png'); makeLogo();
  portrait.src = '../assets/portrait_dian_sidibe.jpg'; await portrait.decode();
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(hdri).texture;
  scene.add(new THREE.AmbientLight(0xffffff, .15));
  await makeCard(); await makeGlobe(); await makePanels();
  window.renderAt(0);
  return true;
})();
</script>

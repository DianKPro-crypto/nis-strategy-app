  <script>
    // Découpe en lettres (déterministe, au chargement)
    document.querySelectorAll("#root .split").forEach((el) => {
      const txt = el.textContent;
      el.textContent = "";
      for (const c of txt) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c === " " ? " " : c;
        el.appendChild(s);
      }
    });

    const tl = gsap.timeline({ paused: true });
    const q = (sel) => Array.from(document.querySelectorAll(sel));

    function scrimIn(g, at) {
      tl.fromTo(`${g} .scrim`, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, at);
    }
    function kill(g, end) {
      tl.to(`${g} .scrim`, { opacity: 0, duration: 0.45, ease: "sine.in" }, end - 0.5);
      tl.set([`${g} .inner`, `${g} .scrim`], { opacity: 0 }, end - 0.04);
    }

    // B · Éclosion : les lettres de chaque ligne s'ouvrent depuis leur centre
    function bloom(g, wordAt, end, inDur = 0.85) {
      scrimIn(g, wordAt - 0.15);
      q(`${g} .bloom`).forEach((line, li) => {
        const chars = Array.from(line.querySelectorAll(".ch"));
        const mid = (chars.length - 1) / 2;
        const start = wordAt - 0.1 + li * 0.18;
        chars.forEach((c, i) => {
          tl.fromTo(
            c,
            { opacity: 0, x: (mid - i) * 22, y: 26, scale: 0.7, filter: "blur(10px)" },
            { opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: inDur, ease: "expo.out" },
            start + Math.abs(i - mid) * (inDur < 0.6 ? 0.015 : 0.035),
          );
          tl.to(c, { opacity: 0, y: -18, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, end - 0.5 + i * 0.012);
        });
      });
      tl.fromTo(`${g} .bloom`, { scale: 0.96 }, { scale: 1.03, duration: end - wordAt, ease: "none" }, wordAt);
      kill(g, end);
    }

    // A · Révélation : mot par mot, sur la voix, puis trait d'or
    function reveal(g, times, end) {
      const words = q(`${g} .w`);
      scrimIn(g, times[0] - 0.2);
      words.forEach((w, i) => {
        tl.fromTo(
          w,
          { opacity: 0, y: 34, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          times[i],
        );
      });
      tl.fromTo(
        `${g} .rule`,
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.9, ease: "power2.inOut" },
        times[times.length - 1] + 0.1,
      );
      tl.to(`${g} .inner`, { opacity: 0, y: -14, duration: 0.45, ease: "power2.in" }, end - 0.5);
      kill(g, end);
    }

    // C · Signature : les mots montent, « fleurir » pousse du bas, lueur et graines de lumière
    function sig(g, smallTimes, fleurirAt, end) {
      scrimIn(g, (smallTimes[0] ?? fleurirAt) - 0.15);
      q(`${g} .sig-small .w`).forEach((w, i) => {
        tl.fromTo(
          w,
          { opacity: 0, y: 40, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          smallTimes[i],
        );
      });
      q(`${g} .sig-big .ch`).forEach((c, i) => {
        tl.fromTo(
          c,
          { opacity: 0, y: 90, scaleY: 0.4, transformOrigin: "50% 100%" },
          { opacity: 1, y: 0, scaleY: 1, duration: 0.9, ease: "back.out(1.6)" },
          fleurirAt + i * 0.07,
        );
      });
      tl.fromTo(
        `${g} .sig-big`,
        { textShadow: "0 0 0px rgba(227,179,76,0), 0 4px 30px rgba(11,11,12,0.55)" },
        {
          textShadow: "0 0 46px rgba(243,211,137,0.95), 0 4px 30px rgba(11,11,12,0.55)",
          duration: 0.7,
          ease: "sine.out",
          yoyo: true,
          repeat: 1,
        },
        fleurirAt + 0.6,
      );
      q(`${g} .seed`).forEach((s, i) => {
        const at = fleurirAt + 0.75 + i * 0.12;
        const dx = (i - 2) * 18;
        tl.fromTo(s, { opacity: 0, x: 0, y: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "sine.out" }, at);
        tl.to(s, { x: dx, y: -160 - i * 18, duration: 1.6, ease: "sine.out" }, at);
        tl.to(s, { opacity: 0, duration: 0.6, ease: "sine.in" }, at + 1.0);
      });
      tl.to(`${g} .inner`, { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, end - 0.55);
      kill(g, end);
    }

    // D · Invocation : lettres qui apparaissent dans un halo
    function allah(g, yaAt, allahAt, end) {
      const chars = q(`${g} .ch`);
      scrimIn(g, yaAt - 0.1);
      chars.forEach((c, i) => {
        tl.fromTo(
          c,
          { opacity: 0, y: 12, filter: "blur(12px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "sine.out" },
          (i < 2 ? yaAt : allahAt) + i * 0.06,
        );
      });
      tl.fromTo(`${g} .halo`, { scale: 0.45, opacity: 0 }, { scale: 0.75, opacity: 0.7, duration: 0.6, ease: "sine.out" }, allahAt - 0.05);
      tl.to(`${g} .halo`, { scale: 1.35, opacity: 0, duration: 1.8, ease: "sine.out" }, allahAt + 0.55);
      tl.fromTo(`${g} .allah`, { scale: 0.97 }, { scale: 1.03, duration: end - yaAt, ease: "none" }, yaAt);
      tl.to(`${g} .inner`, { opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "sine.in" }, end - 0.65);
      kill(g, end);
    }

    // ---- Accents (temps de la chanson, en secondes) ----
    allah("#g-allah1", 6.879, 7.617, 10.6);
    bloom("#g-mains", 16.32, 20.7);
    reveal("#g-coeur", [20.854, 21.157, 21.801], 24.6);

    bloom("#g-terre", 56.064, 59.1);
    reveal("#g-jardin", [60.414, 60.649], 62.6);
    sig("#g-sig1", [62.812, 63.0, 63.366], 64.137, 66.75);
    bloom("#g-amour", 71.731, 72.7, 0.45);
    allah("#g-allah2", 72.7, 72.962, 75.5);
    reveal("#g-respire", [78.913, 79.474], 81.4);

    bloom("#g-douceur", 118.864, 121.9);
    reveal("#g-confier", [132.844, 132.98, 133.627, 133.987, 134.221], 137.6);
    bloom("#g-part", 138.182, 141.3);

    sig("#g-fleurir2", [], 149.179, 152.6);
    bloom("#g-avenir", 163.803, 166.2);
    sig("#g-sig2", [175.257, 175.488, 175.86], 176.695, 179.15);

    allah("#g-allah3", 181.152, 181.79, 185.3);
    reveal("#g-recommence", [190.42, 191.458, 191.699], 197.5);

    window.__timelines["mots"] = tl;
  </script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu WhatsApp</title>
<style>
/* Image d'aperçu du lien (1200 × 630), composée comme l'écran que Souleika découvre en touchant le lien :
   titre, date, enveloppe scellée au centre. Aucune photo, pour garder la surprise. WhatsApp n'affiche qu'une
   image figée : l'invitation du bas l'amène au compte à rebours, qui tourne en direct sur la page. */
@font-face { font-family: "Playfair Display"; src: url(media/playfair-700.woff) format("woff"); font-weight: 700; }
@font-face { font-family: "Playfair Display"; src: url(media/playfair-500-italic.woff) format("woff"); font-weight: 500; font-style: italic; }
@font-face { font-family: "Inter"; src: url(media/inter-500.woff) format("woff"); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(media/inter-600.woff) format("woff"); font-weight: 600; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background:
    radial-gradient(70% 80% at 50% 0%, #1B1650 0%, rgba(27, 22, 80, 0) 62%),
    radial-gradient(60% 70% at 50% 115%, #3A1240 0%, rgba(58, 18, 64, 0) 65%),
    linear-gradient(180deg, #070B1F 0%, #0B1030 55%, #120A2A 100%);
  font-family: "Inter", sans-serif; color: #F5EFE5;
  display: flex; flex-direction: column; align-items: center;
}
canvas { position: absolute; inset: 0; }
h1, .date, .enveloppe, .invite { position: relative; z-index: 1; }
h1 { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 88px; line-height: 1;
     margin: 38px 0 0; color: #F6DFA0; text-shadow: 0 0 30px rgba(227, 179, 76, .45); }
.date { margin: 16px 0 0; padding-left: .42em; font-size: 23px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase;
        color: rgba(245, 239, 229, .88); }
.enveloppe { width: 456px; aspect-ratio: 3 / 2; margin-top: 26px; }
.halo { position: absolute; inset: -40px -70px; border-radius: 50%; z-index: -1;
        background: radial-gradient(closest-side, rgba(227, 179, 76, .22), rgba(227, 179, 76, 0)); }
.dos, .poche, .rabat { position: absolute; inset: 0; border-radius: 14px; }
.dos { background: linear-gradient(160deg, #18225A 0%, #0E1440 60%, #0A0F33 100%); box-shadow: 0 26px 60px rgba(0, 0, 0, .6); }
.poche { background: linear-gradient(170deg, #1C2766 0%, #121A4E 55%, #0C1240 100%); clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
.rabat::before, .rabat::after { content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 62%); }
.rabat::before { background: linear-gradient(180deg, #F6DFA0, #B8862E); }
.rabat::after { inset: 2px 3px 0; background: linear-gradient(180deg, #24307A 0%, #172060 70%); }
svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sceau { position: absolute; left: 50%; top: 62%; width: 104px; height: 104px; margin: -52px 0 0 -52px;
         border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
         background: radial-gradient(circle at 35% 28%, #C8384F 0%, #9A1F34 42%, #5F0E1E 100%);
         box-shadow: 0 10px 20px rgba(0, 0, 0, .5), 0 0 0 13px rgba(227, 179, 76, .18), inset 0 2px 3px rgba(255, 255, 255, .28), inset 0 -6px 10px rgba(0, 0, 0, .38);
         display: flex; align-items: center; justify-content: center; }
.sceau img { width: 60%; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .55)) drop-shadow(0 -1px 0 rgba(255, 225, 160, .35)); }
.invite { margin: 28px 0 0; font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 38px; line-height: 1;
          color: #F6DFA0; text-shadow: 0 0 18px rgba(227, 179, 76, .35); }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<h1>Pour Souleika</h1>
<p class="date">31 octobre · minuit</p>
<div class="enveloppe">
  <div class="halo"></div>
  <div class="dos"></div><div class="poche"></div>
  <svg viewBox="0 0 300 200" preserveAspectRatio="none"><path d="M1 1 L150 112 L299 1" fill="none" stroke="rgba(227,179,76,.75)" stroke-width="1"/>
    <path d="M1 199 L120 96 M299 199 L180 96" fill="none" stroke="rgba(227,179,76,.35)" stroke-width="1"/>
    <rect x=".5" y=".5" width="299" height="199" rx="10" fill="none" stroke="rgba(227,179,76,.55)" stroke-width="1"/></svg>
  <div class="rabat"></div>
  <div class="sceau"><img src="media/dk.png" alt=""></div>
</div>
<p class="invite">Touche pour voir le compte à rebours ✨</p>
<script>
// ciel étoilé fixe (tirage déterministe) et une étoile filante, comme sur la carte
const c = document.getElementById("c").getContext("2d");
let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 240; i++) {
  const x = r() * 1200, y = r() * 630, rad = .4 + r() ** 2.4 * 1.8, a = .3 + r() * .7;
  c.fillStyle = r() < .2 ? `rgba(246,214,140,${a})` : `rgba(255,248,232,${a})`;
  c.beginPath(); c.arc(x, y, rad, 0, 6.283); c.fill();
}
const g = c.createLinearGradient(1010, 120, 1130, 66);
g.addColorStop(0, "rgba(255,248,230,.95)"); g.addColorStop(1, "rgba(255,248,230,0)");
c.strokeStyle = g; c.lineWidth = 2.2; c.lineCap = "round"; c.beginPath(); c.moveTo(1010, 120); c.lineTo(1130, 66); c.stroke();
</script>
</body>
</html>

<title>Boussole IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Boussole IA · Santé publique : préparer, protéger, produire et vérifier chaque usage de l'IA dans les missions de santé publique.">
<style>
/* Mise en page : rail de navigation à gauche sur ordinateur, barre d'onglets en bas sur mobile ;
   contenu en colonne de lecture, outils en grilles. Charte Dian K Pro : noir et or, Playfair Display + Inter,
   Cinzel réservé à la signature de marque. Le « châssis » (navigation, barres) reste noir dans les deux thèmes. */
:root {
  --chassis: #0B0B0C;
  --chassis-2: #17171A;
  --chassis-ligne: #2A2924;
  --chassis-texte: #F5F2EB;
  --chassis-texte-2: #CBC5B8;
  --chassis-or: #E3B34C;
  --chassis-or-voile: rgba(227, 179, 76, .13);
  --or-degrade: linear-gradient(180deg, #EDC468 0%, #DCA944 100%);
  --f-marque: Cinzel, "Trajan Pro", "Cormorant SC", Georgia, serif;
  --bg: #0B0B0C;
  --bg-voile: rgba(11, 11, 12, .86);
  --surface: #151517;
  --surface-2: #1D1D20;
  --line: #2C2B28;
  --line-strong: #45423B;
  --fg: #F5F2EB;
  --fg-2: #D6D0C4;
  --fg-3: #ABA497;
  --or: #E3B34C;
  --or-texte: #E8BC5C;
  --sur-or: #0B0B0C;
  --or-voile: rgba(227, 179, 76, .13);
  --or-bord: rgba(227, 179, 76, .45);
  --ok: #62C995;
  --ok-voile: rgba(98, 201, 149, .14);
  --att: #F2A65A;
  --att-voile: rgba(242, 166, 90, .15);
  --bloq: #F47C72;
  --bloq-voile: rgba(244, 124, 114, .15);
  --ombre: 0 18px 40px rgba(0, 0, 0, .35);
  --f-titre: "Playfair Display", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-texte: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --rayon: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F5F2; --bg-voile: rgba(245, 245, 242, .88); --surface: #FFFFFF; --surface-2: #EFEDE7;
    --line: #E1DDD3; --line-strong: #C9C2B2; --fg: #141413; --fg-2: #37342E; --fg-3: #5C574C;
    --or: #E3B34C; --or-texte: #85600F; --sur-or: #0B0B0C; --or-voile: rgba(227, 179, 76, .18); --or-bord: rgba(160, 118, 24, .45);
    --ok: #1C7A4E; --ok-voile: rgba(28, 122, 78, .1); --att: #A8520A; --att-voile: rgba(168, 82, 10, .1);
    --bloq: #B3261E; --bloq-voile: rgba(179, 38, 30, .09); --ombre: 0 14px 34px rgba(40, 32, 12, .1);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F5F2; --bg-voile: rgba(245, 245, 242, .88); --surface: #FFFFFF; --surface-2: #EFEDE7;
  --line: #E1DDD3; --line-strong: #C9C2B2; --fg: #141413; --fg-2: #37342E; --fg-3: #5C574C;
  --or: #E3B34C; --or-texte: #85600F; --sur-or: #0B0B0C; --or-voile: rgba(227, 179, 76, .18); --or-bord: rgba(160, 118, 24, .45);
  --ok: #1C7A4E; --ok-voile: rgba(28, 122, 78, .1); --att: #A8520A; --att-voile: rgba(168, 82, 10, .1);
  --bloq: #B3261E; --bloq-voile: rgba(179, 38, 30, .09); --ombre: 0 14px 34px rgba(40, 32, 12, .1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--f-texte); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--chassis); }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--or-texte); }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

h1, h2 { font-family: var(--f-titre); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem); }
h1, h2, .porte-titre, .verdict-titre, .ck-bloc legend, .marque-nom { font-variant-numeric: lining-nums; }
.chiffre b, .score b, .module-num, .cinq-temps li::before { font-variant-numeric: lining-nums tabular-nums; }
h2 { font-size: clamp(1.35rem, 1.15rem + .8vw, 1.7rem); }
h3 { font-size: 1.1rem; font-weight: 650; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.surtitre { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--or-texte); font-weight: 650; }
.discret { color: var(--fg-3); font-size: .92rem; }
.chapeau { font-size: 1.12rem; color: var(--fg-2); max-width: 62ch; }
.pile { display: grid; gap: 16px; }
.pile-l { display: grid; gap: 28px; }
.rangee { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* --- Structure --- */
.app { min-height: 100vh; }
.nav { display: none; }
.barre-haut {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--chassis); color: var(--chassis-texte); border-bottom: 1px solid var(--chassis-ligne);
}
.barre-haut .outils-haut { display: flex; gap: 6px; }
.btn-icone { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--chassis-ligne); background: var(--chassis-2); color: var(--chassis-texte-2); text-decoration: none; cursor: pointer; }
.btn-icone.actif { color: var(--chassis-or); border-color: var(--chassis-or); }
.vue { max-width: 1440px; margin: 0 auto; padding-block: 24px 128px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--chassis); border-top: 1px solid var(--chassis-ligne);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.onglets a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; font-size: .74rem; font-weight: 550; color: var(--chassis-texte-2); text-decoration: none; }
.onglets a.actif { color: var(--chassis-or); }
.onglets .ico { width: 22px; height: 22px; }

/* Logo Dian K Pro : masque alpha coloré par le thème (images intégrées par construire.py) */
.logo-mono { display: block; flex: none; aspect-ratio: 261 / 240; height: 40px; background: var(--logo-couleur, var(--or-texte)); -webkit-mask: var(--logo-mono) center / contain no-repeat; mask: var(--logo-mono) center / contain no-repeat; }
.marque { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--chassis-texte); --logo-couleur: var(--chassis-or); }
.marque .logo-mono { height: 38px; }
.marque-texte { display: grid; gap: 5px; }
.marque-nom { font-family: var(--f-titre); font-size: 1.22rem; font-weight: 700; line-height: 1; color: var(--chassis-texte); }
.marque-maison { font-family: var(--f-marque); font-size: .7rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--chassis-or); line-height: 1; }
.devise { display: flex; align-items: center; gap: 12px; font-size: .86rem; letter-spacing: .04em; color: var(--chassis-or); }
.devise > span:not(.filet) { white-space: nowrap; }
.devise .filet { position: relative; flex: 1; height: 1px; background: currentColor; opacity: .7; min-width: 12px; }
.devise .filet::after { content: ""; position: absolute; top: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.devise .filet.g::after { right: 0; } .devise .filet.d::after { left: 0; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
  .barre-haut, .onglets { display: none; }
  .nav { display: flex; flex-direction: column; gap: 30px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 22px; border-right: 1px solid var(--chassis-ligne); background: var(--chassis); color: var(--chassis-texte-2); }
  .nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .nav a.lien-nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--chassis-texte-2); text-decoration: none; font-weight: 520; font-size: .98rem; }
  .nav a.lien-nav:hover { background: var(--chassis-2); color: var(--chassis-texte); }
  .nav a.lien-nav.actif { background: var(--chassis-or-voile); color: var(--chassis-or); font-weight: 620; }
  .nav .sep { height: 1px; background: var(--chassis-ligne); margin: 10px 12px; }
  .nav-pied { margin-top: auto; font-size: .78rem; color: var(--chassis-texte-2); padding: 0 12px; display: grid; gap: 10px; }
  .nav-pied .devise { font-size: .76rem; font-style: italic; letter-spacing: .02em; }
  .nav-pied .devise > span { white-space: normal; text-wrap: balance; }
  .vue { padding-block: 40px 88px; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); }
}

/* --- Boutons et puces --- */
.btn, .btn-sec, .btn-lien { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; font-weight: 620; font-size: .98rem; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn { background: var(--or-degrade); color: var(--sur-or); border: 1px solid var(--or); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 6px 18px rgba(227, 179, 76, .18); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled], .btn-sec[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn-sec { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }
.btn-sec:hover { border-color: var(--or-bord); }
.btn-lien { background: none; border: 0; padding: 6px 4px; min-height: 0; color: var(--or-texte); font-weight: 600; }
.btn-lien:hover { text-decoration: underline; }
.btn.copie, .btn-sec.copie { background: var(--ok); border-color: var(--ok); color: var(--sur-or); }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--fg-2); font-size: .8rem; font-weight: 560; line-height: 1.5; white-space: nowrap; }
.puce.or { border-color: var(--or-bord); color: var(--or-texte); background: var(--or-voile); }
.puce.ok, .puce.N0 { border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); background: var(--ok-voile); }
.puce.N1 { border-color: var(--or-bord); color: var(--or-texte); background: var(--or-voile); }
.puce.att, .puce.N2 { border-color: color-mix(in srgb, var(--att) 50%, transparent); color: var(--att); background: var(--att-voile); }
.puce.bloq, .puce.N3 { border-color: color-mix(in srgb, var(--bloq) 50%, transparent); color: var(--bloq); background: var(--bloq-voile); }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .9rem; font-weight: 560; color: var(--fg-2); }
.filtre[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.recherche { width: 100%; max-width: 420px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); }
.recherche::placeholder, textarea::placeholder, input::placeholder { color: var(--fg-3); opacity: 1; }
.barre-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid var(--line); }
.retour { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); background: none; border: 0; cursor: pointer; padding: 4px 0; font-size: .92rem; font-weight: 560; }
.retour:hover { color: var(--fg); }

/* --- Panneaux --- */
.panneau { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rayon); padding: 22px; }
.panneau-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.grille { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.duo { display: grid; gap: 20px; align-items: start; }
@media (min-width: 860px) { .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.bandeau { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--att); background: var(--att-voile); color: var(--fg); font-size: .92rem; }

/* --- Accueil --- */
.couverture {
  position: relative; overflow: hidden; display: grid; gap: 28px; align-items: center;
  padding: clamp(24px, 4vw, 48px); border-radius: 24px; border: 1px solid rgba(227, 179, 76, .32);
  background: radial-gradient(circle at 78% 42%, rgba(227, 179, 76, .17), transparent 52%), var(--chassis);
  color: var(--chassis-texte); --logo-couleur: var(--chassis-or);
}
@media (min-width: 860px) { .couverture { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.couv-texte { display: grid; gap: 18px; position: relative; z-index: 1; }
.couv-maison { display: flex; flex-wrap: wrap; column-gap: .9em; row-gap: 4px; font-family: var(--f-marque); font-size: .8rem; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--chassis-or); }
.couverture h1 { font-size: clamp(2.7rem, 1.8rem + 4.2vw, 4.6rem); color: var(--chassis-texte); }
.couverture h1 em { font-style: normal; color: var(--chassis-or); }
.salut { font-size: 1.05rem; color: var(--chassis-texte-2); }
.couv-chapeau { font-size: 1.12rem; color: var(--chassis-texte-2); max-width: 54ch; }
.couv-visuel { position: relative; display: grid; place-items: center; min-height: 200px; }
.couv-visuel .logo-mono { height: clamp(150px, 22vw, 250px); position: relative; z-index: 1; filter: drop-shadow(0 10px 30px rgba(227, 179, 76, .25)); }
.circuits { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--chassis-or); opacity: .5; }
.circuits path { stroke-dasharray: 260; stroke-dashoffset: 0; animation: tracer 1.8s ease-out both; }
.circuits circle { animation: noeud 1.8s ease-out both; }
@keyframes tracer { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
@keyframes noeud { 0%, 60% { opacity: 0; } 100% { opacity: 1; } }
@media (max-width: 859px) { .couv-visuel { order: -1; min-height: 0; justify-items: start; } .couv-visuel .logo-mono { height: 96px; } .circuits { display: none; } }

/* Signature de bas de page */
.signature { display: grid; justify-items: center; gap: 12px; text-align: center; margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); --logo-couleur: var(--or-texte); }
.signature .logo-mono { height: 44px; }
.sig-maison { font-family: var(--f-marque); font-size: .95rem; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--or-texte); }
.sig-titre { font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.signature .devise { color: var(--or-texte); width: min(440px, 100%); }
.signature .discret { font-size: .8rem; }
.portes { display: grid; gap: 14px; }
@media (min-width: 760px) { .portes { grid-template-columns: 1.25fr 1fr 1fr; } }
.porte { display: grid; align-content: start; gap: 10px; text-align: left; padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; transition: border-color .15s, transform .15s; }
.porte:hover { border-color: var(--or-bord); transform: translateY(-1px); }
.porte .ico { width: 26px; height: 26px; color: var(--or-texte); }
.porte-titre { font-family: var(--f-titre); font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.porte-texte { color: var(--fg-2); font-size: .95rem; }
.porte-cta { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: .92rem; color: var(--or-texte); margin-top: 4px; }
.porte-principale { background: var(--or-degrade); border-color: var(--or); color: var(--sur-or); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 14px 34px rgba(227, 179, 76, .2); }
.porte-principale .ico, .porte-principale .porte-cta, .porte-principale .porte-texte { color: var(--sur-or); }
.porte-principale:hover { border-color: var(--or); filter: brightness(1.05); }
.comp { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.comp:last-child { border-bottom: 0; padding-bottom: 0; }
.comp-tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
.jauge { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.jauge > span { position: absolute; inset: 0 auto 0 0; background: var(--or); border-radius: 99px; }
.jauge > i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.comp-desc { font-size: .86rem; color: var(--fg-3); }
.niv-Découverte { } .niv-Pratique { border-color: var(--or-bord); color: var(--or-texte); } .niv-Maîtrise { background: var(--or); color: var(--sur-or); border-color: var(--or); }
.chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chiffre { padding: 14px; border-radius: 12px; background: var(--surface-2); }
.chiffre b { display: block; font-family: var(--f-titre); font-size: 1.7rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.chiffre span { font-size: .84rem; color: var(--fg-3); }
.suivant { display: grid; gap: 8px; padding: 18px; border-radius: 14px; border: 1px solid var(--or-bord); background: var(--or-voile); }
.cinq-temps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); counter-reset: t; }
.cinq-temps li { counter-increment: t; padding: 16px; border-top: 2px solid var(--or); background: var(--surface); border-radius: 0 0 12px 12px; display: grid; gap: 4px; }
.cinq-temps li::before { content: "0" counter(t); font-family: var(--f-titre); color: var(--or-texte); font-size: 1.1rem; font-weight: 700; }
.cinq-temps b { font-size: 1.02rem; }
.cinq-temps span { font-size: .88rem; color: var(--fg-3); }

/* --- Mission --- */
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stepper li { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: .78rem; font-weight: 600; color: var(--fg-3); position: relative; }
.stepper li::after { content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--line); }
.stepper li:last-child::after { display: none; }
.stepper .rond { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); background: var(--bg); font-size: .9rem; color: var(--fg-2); }
.stepper li.fait .rond { background: var(--or-voile); border-color: var(--or); color: var(--or-texte); }
.stepper li.fait::after { background: var(--or-bord); }
.stepper li.actif { color: var(--fg); }
.stepper li.actif .rond { background: var(--or); border-color: var(--or); color: var(--sur-or); }
.stepper button { all: unset; display: grid; justify-items: center; gap: 6px; cursor: pointer; }
.stepper button:focus-visible { outline: 2px solid var(--or); outline-offset: 4px; border-radius: 8px; }
.tache-entete { display: grid; gap: 8px; padding: 18px 20px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--line); }
.taches { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.tache { display: grid; gap: 8px; text-align: left; padding: 18px; border-radius: var(--rayon); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); transition: border-color .15s; }
.tache:hover { border-color: var(--or-bord); }
.tache h3 { font-size: 1.04rem; }
.tache p { color: var(--fg-2); font-size: .92rem; }
.gain { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.gain .ico { width: 16px; height: 16px; }
.entrainement { padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line-strong); font-size: .9rem; color: var(--fg-2); }

/* Checklist */
.ck-grille { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1100px) { .ck-grille { grid-template-columns: minmax(0, 1fr) 360px; } .ck-grille .verdict { position: sticky; top: 24px; } }
.ck-bloc { border: 0; margin: 0; padding: 0; display: grid; gap: 14px; }
.ck-bloc legend { font-family: var(--f-titre); font-size: 1.25rem; font-weight: 600; padding: 0; margin-bottom: 4px; }
.ck-q { display: grid; gap: 10px; padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ck-q.repondu { border-color: var(--line-strong); }
.ck-q > p { font-weight: 560; }
.ck-indice { font-size: .85rem; color: var(--fg-3); }
.ck-opts { display: grid; gap: 8px; }
.ck-opts.cartes { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.ck-opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .94rem; display: grid; gap: 3px; }
.ck-opt:hover { border-color: var(--or-bord); }
.ck-opt[aria-pressed="true"] { border-color: var(--or); background: var(--or-voile); }
.ck-opt b { font-weight: 650; }
.ck-opt small { color: var(--fg-3); font-size: .82rem; line-height: 1.45; }
.select { width: 100%; max-width: 420px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); }
.verdict { display: grid; gap: 14px; padding: 20px; border-radius: var(--rayon); border: 1px solid var(--line-strong); background: var(--surface); }
.verdict.v-ok { border-color: var(--ok); background: linear-gradient(var(--ok-voile), var(--ok-voile)), var(--surface); }
.verdict.v-attention { border-color: var(--att); background: linear-gradient(var(--att-voile), var(--att-voile)), var(--surface); }
.verdict.v-bloquant { border-color: var(--bloq); background: linear-gradient(var(--bloq-voile), var(--bloq-voile)), var(--surface); }
.verdict-tete { display: flex; gap: 14px; align-items: center; }
.feu { display: grid; gap: 5px; padding: 7px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); flex: none; }
.feu span { width: 14px; height: 14px; border-radius: 50%; background: var(--line-strong); opacity: .5; }
.v-bloquant .feu .r { background: var(--bloq); opacity: 1; box-shadow: 0 0 10px var(--bloq); }
.v-attention .feu .o { background: var(--att); opacity: 1; box-shadow: 0 0 10px var(--att); }
.v-ok .feu .v { background: var(--ok); opacity: 1; box-shadow: 0 0 10px var(--ok); }
.verdict-titre { font-family: var(--f-titre); font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.conseils { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conseils li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: .9rem; align-items: start; }
.conseils .pastille { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.pastille.ok { background: var(--ok); } .pastille.attention { background: var(--att); } .pastille.bloquant { background: var(--bloq); }
.pays-encart { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; }

/* Produire */
.produire { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1100px) { .produire { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } .col-prompt { position: sticky; top: 24px; } }
.champ { display: grid; gap: 6px; }
.champ label { font-weight: 600; font-size: .95rem; }
.champ input, .champ textarea, textarea.zone { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: .95rem; line-height: 1.5; }
.champ textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: .86rem; }
.champ textarea.libre { min-height: 90px; font-family: var(--f-texte); font-size: .95rem; }
.champ-aide { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--fg-3); }
.prompt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: .86rem/1.6 var(--f-mono); color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-height: 62vh; overflow: auto; }
.prompt mark { border-radius: 4px; padding: 0 3px; }
.prompt mark.vide { background: var(--or-voile); color: var(--or-texte); outline: 1px dashed var(--or-bord); }
.prompt mark.rempli { background: var(--ok-voile); color: var(--fg); }
details.depli { border-top: 1px solid var(--line); padding-top: 12px; }
details.depli summary { cursor: pointer; font-weight: 620; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.depli summary::-webkit-details-marker { display: none; }
details.depli summary::after { content: "+"; color: var(--or-texte); font-weight: 700; }

details.depli > div { padding-top: 12px; }
.cadre-liste { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cadre-liste li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: .92rem; color: var(--fg-2); }
.lettre { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--or-voile); color: var(--or-texte); font-family: var(--f-titre); font-weight: 700; font-size: 1.1rem; }
.relance { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .92rem; color: var(--fg-2); }
.relance:last-child { border-bottom: 0; }
.relance button { flex: none; }
.liens-outils { display: flex; flex-wrap: wrap; gap: 8px; }
.liens-outils a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); text-decoration: none; color: var(--fg-2); font-size: .88rem; font-weight: 560; }
.liens-outils a:hover { border-color: var(--or-bord); color: var(--fg); }
.liens-outils .ico { width: 15px; height: 15px; }

/* Vérifier */
.verif-liste { display: grid; gap: 12px; }
.verif-item { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.verif-item .lettre { width: 48px; height: 48px; font-size: 1.5rem; }
.verif-item .rangee { margin-top: 8px; }
.choix { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .88rem; font-weight: 580; }
.choix[aria-pressed="true"].c-ok { background: var(--ok-voile); border-color: var(--ok); color: var(--ok); }
.choix[aria-pressed="true"].c-attention { background: var(--att-voile); border-color: var(--att); color: var(--att); }
.choix[aria-pressed="true"].c-na { background: var(--surface-2); border-color: var(--fg-3); }
.coches { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.coche { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .93rem; text-align: left; width: 100%; }
.coche .case { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-strong); display: grid; place-items: center; margin-top: 1px; }
.coche[aria-pressed="true"] .case { background: var(--ok); border-color: var(--ok); color: var(--sur-or); }
.coche .case .ico { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }
.coche[aria-pressed="true"] .case .ico { opacity: 1; }
.liste-simple { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; color: var(--fg-2); font-size: .94rem; }

/* --- Bibliothèque --- */
.carte-prompt { position: relative; display: grid; gap: 10px; align-content: start; padding: 20px; border-radius: var(--rayon); border: 1px solid var(--line); background: var(--surface); }
.carte-prompt:hover { border-color: var(--or-bord); }
.carte-prompt h3 a { color: var(--fg); text-decoration: none; }
.carte-prompt h3 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--rayon); }
.carte-prompt p { color: var(--fg-2); font-size: .92rem; }
.etoile { position: relative; z-index: 2; background: none; border: 0; cursor: pointer; color: var(--fg-3); padding: 4px; }
.etoile[aria-pressed="true"] { color: var(--or); }
.etoile[aria-pressed="true"] .ico { fill: var(--or); }
.carte-tete { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.fiche { display: grid; gap: 22px; }
.fiche-sections { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.table-defil { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 650; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td { color: var(--fg-2); }

/* --- Parcours --- */
.modules { display: grid; gap: 12px; }
.module { display: grid; grid-template-columns: 64px 1fr; gap: 18px; text-align: left; padding: 20px; border-radius: var(--rayon); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); align-items: center; }
.module:hover { border-color: var(--or-bord); }
.module-num { font-family: var(--f-titre); font-size: 2.2rem; font-weight: 700; color: var(--or-texte); line-height: 1; text-align: center; }
.module.inactif .module-num { color: var(--fg-3); }
.module-corps { display: grid; gap: 6px; min-width: 0; }
.module-corps p { color: var(--fg-2); font-size: .92rem; }
.mini-jauge { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; max-width: 260px; }
.mini-jauge span { display: block; height: 100%; background: var(--or); }
.lecons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: l; }
.lecons button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.lecons button:hover { border-color: var(--or-bord); }
.lecons .etat { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); font-size: .85rem; font-weight: 700; color: var(--fg-3); }
.lecons .lue .etat { background: var(--ok); border-color: var(--ok); color: var(--sur-or); }
.lecons .etat .ico { width: 15px; height: 15px; stroke-width: 3; }
.lecon { display: grid; gap: 22px; max-width: 760px; }
.lecon-corps { display: grid; gap: 14px; color: var(--fg-2); font-size: 1.02rem; line-height: 1.7; }
.lecon-corps h4 { margin: 10px 0 0; font-size: 1.05rem; color: var(--fg); font-weight: 650; }
.lecon-corps ul, .lecon-corps ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.lecon-corps strong { color: var(--fg); }
.encadre { padding: 14px 16px; border-radius: 12px; background: var(--or-voile); border: 1px solid var(--or-bord); color: var(--fg); font-size: .96rem; }
.exemple { padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font: .88rem/1.65 var(--f-mono); color: var(--fg-2); overflow-wrap: anywhere; }
.retenir { padding: 18px 20px; border-radius: var(--rayon); border: 1px solid var(--line-strong); background: var(--surface); display: grid; gap: 10px; }
.retenir ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.quiz-q { display: grid; gap: 12px; padding: 18px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--line); }
.quiz-q > p { font-weight: 600; }
.opt { text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .95rem; width: 100%; }
.opt:hover:not([disabled]) { border-color: var(--or-bord); }
.opt[disabled] { cursor: default; }
.opt.bonne { border-color: var(--ok); background: var(--ok-voile); }
.opt.fausse { border-color: var(--bloq); background: var(--bloq-voile); }
.explication { font-size: .9rem; color: var(--fg-2); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.score { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 18px 20px; border-radius: var(--rayon); border: 1px solid var(--or-bord); background: var(--or-voile); }
.score b { font-family: var(--f-titre); font-size: 1.6rem; }
.contexte-ia { padding: 14px 16px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; color: var(--fg-2); }
.reponse-ia { padding: 20px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; line-height: 1.75; }
.reponse-ia .entete-ia { display: flex; align-items: center; gap: 8px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); font-weight: 650; }
.seg { cursor: pointer; border-radius: 4px; padding: 1px 2px; transition: background .12s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.seg:hover { background: var(--surface-2); }
.seg.sel { background: var(--or-voile); box-shadow: inset 0 -2px 0 var(--or); }
.seg.trouve { background: var(--ok-voile); box-shadow: inset 0 -2px 0 var(--ok); }
.seg.manque { background: var(--bloq-voile); box-shadow: inset 0 -2px 0 var(--bloq); }
.seg.fauxpos { text-decoration: line-through; text-decoration-color: var(--fg-3); }
.verifie .seg { cursor: default; }
.erreur-expl { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; }
.detection { display: flex; flex-wrap: wrap; gap: 8px; }

/* --- Éthique --- */
.onglets-int { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.onglets-int button { padding: 10px 14px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--fg-3); border-bottom: 2px solid transparent; white-space: nowrap; font-size: .95rem; }
.onglets-int button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--or); }
.cel { font-weight: 620; font-size: .84rem; }
.cel.ok { color: var(--ok); } .cel.attention { color: var(--att); } .cel.bloquant { color: var(--bloq); }
.niveaux { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.niveau { padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; font-size: .9rem; color: var(--fg-2); }
.cadre-ref { display: grid; gap: 6px; padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.cadre-ref p { color: var(--fg-2); font-size: .93rem; }
.jalons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.jalons li { display: grid; grid-template-columns: 130px 1fr; gap: 12px; font-size: .92rem; }
@media (max-width: 520px) { .jalons li { grid-template-columns: 1fr; gap: 2px; } }
.jalons time { font-weight: 650; font-variant-numeric: tabular-nums; }

/* --- Progression --- */
.journal td:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.verif-mini { display: inline-flex; gap: 3px; }
.verif-mini span { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: .7rem; font-weight: 700; background: var(--surface-2); color: var(--fg-3); }
.verif-mini .ok { background: var(--ok-voile); color: var(--ok); }
.verif-mini .attention { background: var(--att-voile); color: var(--att); }
.vide { padding: 28px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--rayon); color: var(--fg-3); display: grid; gap: 12px; justify-items: center; }

/* --- Mémo --- */
.memo { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.memo .panneau { display: grid; gap: 12px; align-content: start; }
.memo ol, .memo ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; font-size: .93rem; color: var(--fg-2); }

/* --- Toast et modale --- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: .92rem; box-shadow: var(--ombre); }
@media (min-width: 960px) { .toast { bottom: 28px; } }
.modale { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 16px; }
.modale > div { width: min(640px, 100%); max-height: 86vh; overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; padding: 22px; display: grid; gap: 14px; }

@media print {
  .nav, .barre-haut, .onglets, .no-print, .toast { display: none !important; }
  body { background: #fff; color: #000; font-size: 12pt; }
  .vue { padding: 0; max-width: none; }
  .panneau { border-color: #bbb; break-inside: avoid; }
}
</style>

Je prépare une analyse des enfants zéro-dose pour : {{zone}}, période {{periode}}. Elle est destinée à : {{public}}.
Définitions à utiliser : un enfant zéro-dose est un enfant qui n'a reçu aucune dose de vaccin contenant la valence DTC ; on l'approche par l'absence de Penta1. Un enfant ayant reçu Penta1 mais pas Penta3 est incomplètement vacciné.

TÂCHE
1. Pour chaque district, calcule : couverture Penta1 (Penta1 / population cible × 100) ; nombre estimé de zéro-dose (population cible − Penta1) ; proportion de zéro-dose (zéro-dose / population cible × 100) ; part du total des zéro-dose de la zone ; nombre d'enfants incomplètement vaccinés (Penta1 − Penta3).
2. Établis deux classements : par nombre absolu de zéro-dose (où se trouve le volume) et par proportion (où le risque est le plus concentré). Commente les différences entre les deux.
3. Triangule avec les enquêtes fournies : compare l'estimation administrative et l'estimation d'enquête, puis explique les écarts possibles (dénominateur, doses administrées à des enfants venus d'autres zones, période et niveau de représentativité de l'enquête, mode de recueil) sans trancher à la place des données.
4. Pour les 3 districts prioritaires, propose des hypothèses sur les communautés probablement concernées (insécurité, populations nomades ou transhumantes, déplacés internes ou réfugiés, quartiers urbains pauvres, obstacles liés au genre comme l'autonomie de décision ou le temps disponible des mères), en t'appuyant uniquement sur le contexte fourni. Pour chaque hypothèse, indique la donnée ou la méthode qui permettrait de la vérifier (microplanification, cartographie des campements, enquête rapide, données des acteurs humanitaires).
5. Propose 3 à 5 pistes d'action différenciées selon les communautés, présentées comme des options à discuter.

{{donnees}}

DONNÉES D'ENQUÊTE
{{enquetes}}

RÈGLES
- Montre tes calculs et utilise un outil de calcul si tu en disposes.
- N'invente aucun chiffre : ni estimation nationale, régionale ou mondiale, ni résultat d'enquête que je n'ai pas fourni. Tu peux rappeler que la réduction du nombre d'enfants zéro-dose est une priorité de l'IA2030 et de Gavi, sans citer de chiffre.
- Si une couverture dépasse 100 % ou si un nombre de zéro-dose est négatif, signale-le comme un problème de dénominateur ou de qualité des données ; ne le remplace pas par zéro sans le dire.
- Sépare clairement les FAITS (issus des données), les HYPOTHÈSES (à vérifier) et les PISTES D'ACTION.
- Ne stigmatise aucune communauté : décris des obstacles d'accès et des besoins, pas des comportements.
- Si une information manque pour conclure, écris « information manquante » et précise laquelle.

- Tableau 2 : District | Communautés possiblement concernées | Hypothèse | Donnée ou méthode pour vérifier.
- Pistes d'action : 3 à 5 puces.
- Une section « Limites » : dénominateurs, qualité des données, représentativité des enquêtes.

J'examine un extrait DHIS2 pour : {{zone}}, période {{periode}}.
Normes du programme : {{normes}}
Événements connus sur la période : {{contexte}}

TÂCHE
1. Complétude et promptitude : calcule pour chaque mois la complétude (rapports reçus / rapports attendus × 100) et la promptitude (rapports reçus à temps / rapports attendus × 100), puis compare-les aux normes.
2. Cohérence interne : vérifie mois par mois et sur la période cumulée que Penta3 ≤ Penta1 et que RR1 reste cohérent avec Penta1 ; compare BCG à la cible naissances et à Penta1. Rappelle qu'un léger décalage mensuel peut s'expliquer par le calendrier vaccinal, alors qu'une incohérence sur la période cumulée est une anomalie.
3. Valeurs aberrantes et zéros : repère les valeurs qui s'écartent fortement de la médiane de la période, en indiquant la méthode et le seuil retenus ; distingue un zéro plausible d'une donnée manquante saisie à zéro.
4. Ruptures de série : signale les changements brusques de niveau et ce qui pourrait les expliquer (doses de campagne saisies en routine, changement de dénominateur ou de personnel, rupture de stock).
5. Pour chaque anomalie, propose les causes possibles, présentées comme des hypothèses, et la vérification à faire (registre de vaccination, fiche de pointage, rapport de gestion des vaccins, entretien avec le gestionnaire de données).
6. Propose un plan d'action qualité réaliste pour un district : 5 à 8 actions.
7. Conclus sur l'utilisabilité des données : pour quels usages sont-elles suffisamment fiables, et pour lesquels faut-il attendre des corrections ?

{{donnees}}

- Montre tous tes calculs ; utilise un outil de calcul si tu en disposes.
- Ne corrige, ne complète et n'impute aucune valeur : décris l'anomalie et propose la vérification.
- Distingue toujours le CONSTAT (chiffré, issu des données) de la CAUSE POSSIBLE (hypothèse).
- Si une norme n'est pas fournie, dis-le et propose un seuil à faire valider, sans le présenter comme une norme officielle.
- Ne cite aucun guide ni aucune norme que je n'ai pas fournis.

  modele: `Tu es expert(e) en gestion de programmes de vaccination et en gestion des risques, expérimenté(e) dans l'introduction de nouveaux vaccins et l'organisation de campagnes en Afrique.

Calendrier et étapes clés : {{calendrier}}
Ressources et parties prenantes : {{ressources}}

TÂCHE
1. Pré-mortem : nous sommes 12 mois après le lancement et le projet est un échec manifeste. Rédige en 10 lignes le récit plausible de cet échec, en t'appuyant sur le contexte fourni.
2. À partir de ce récit, identifie 10 à 12 causes d'échec possibles, réparties entre les catégories : approvisionnement et chaîne du froid ; ressources humaines et formation ; données et suivi ; demande et confiance communautaire ; gouvernance et coordination ; financement ; sécurité et accès ; équité (populations mobiles, déplacées, urbaines pauvres, obstacles liés au genre).
3. Pour chaque risque, estime la probabilité et l'impact (faible = 1, moyen = 2, élevé = 3) en justifiant brièvement, puis calcule la criticité (probabilité × impact).
4. Pour chaque risque, propose une mesure d'atténuation concrète, un responsable (fonction, pas de nom), une échéance située dans le calendrier et un signal d'alerte observable indiquant que le risque se matérialise.
5. Identifie les 3 risques à traiter en priorité avant le lancement.

CONTEXTE ET CONTRAINTES
{{contexte}}

RÈGLES
- Reste ancré(e) dans le contexte fourni ; distingue les risques tirés du contexte de ceux que tu ajoutes à partir de l'expérience générale.
- N'invente aucune statistique, aucun incident passé, aucune référence ; ne cite aucune donnée sur l'efficacité ou la sécurité du vaccin.
- Les signaux d'alerte doivent être mesurables avec les outils existants (DHIS2, rapports de stock, écoute sociale, supervision).
- Les estimations de probabilité et d'impact sont des jugements à discuter en équipe : présente-les comme tels.

- Matrice des risques : N° | Catégorie | Risque | Probabilité | Impact | Criticité | Mesure d'atténuation | Responsable | Échéance | Signal d'alerte | Origine (contexte fourni / expérience générale).
- Les 3 priorités avant le lancement, en 3 puces.`,

  modele: `Tu es un(e) relecteur(trice) exigeant(e) et indépendant(e), habitué(e) aux comités d'examen de stratégies de vaccination, spécialiste du financement de la santé et de l'équité. Ton rôle est celui d'avocat du diable : trouver les faiblesses avant que d'autres ne les trouvent.

Contexte national connu : {{contexte}}
Lecteurs qui l'examineront : {{lecteurs}}

TÂCHE
1. Hypothèses non étayées : relève les affirmations, objectifs ou cibles qui ne reposent sur aucune donnée, analyse ou justification visible dans le texte.
2. Incohérences : signale les écarts entre problèmes, objectifs, stratégies, ressources et dispositif de suivi (objectif sans stratégie, stratégie sans budget, cible incompatible avec le point de départ).
3. Angles morts d'équité : examine la prise en compte des enfants zéro-dose, des zones de conflit, des populations nomades, déplacées et urbaines pauvres, des obstacles liés au genre et des langues locales.

5. Améliorations : pour chaque faiblesse majeure, propose une amélioration concrète et réaliste (reformulation, analyse à ajouter, donnée à produire).
6. Termine par les 3 forces réelles du document, pour équilibrer la revue.

{{extraits}}

- Les 3 forces, en 3 puces.
- Longueur : 2 pages maximum.`,

    pays: { q: '', region: '', statut: '' },

  // ---------- Progression : points et niveaux ----------
  function points() {
    const p = Object.fromEntries(COMPETENCES.map(c => [c.id, 0]));
    Object.keys(S.lecons).forEach(id => { if (LECONS[id]) p[LECONS[id].competence] += 1; });

    Object.keys(S.exercices).forEach(id => { const e = S.exercices[id]; p[e.competence || 'critique'] += e.score >= .66 ? 2 : 1; });

    return p;
  }
  const niveau = pts => NIVEAUX_COMPETENCE.reduce((n, x) => pts >= x.min ? x : n, NIVEAUX_COMPETENCE[0]);

    const totalLecons = Object.keys(LECONS).length;
    const lues = Object.keys(S.lecons).filter(id => LECONS[id]).length;
    const gain = S.missions.reduce((s, m) => s + (Number(m.gain) || 0), 0);
    return { missions: S.missions.length, gain, verifs: S.verifs.length + S.missions.length, lues, totalLecons };
  }
  function prochaineEtape() {
    const nonLue = mid => { const m = MODULES.find(x => x.id === mid); return m && (m.lecons || []).find(l => !S.lecons[l.id]); };

    exemple: d => { const b = S.brouillon, p = PROMPT[b.promptId], c = p.champs.find(x => x.id === d.id); b.valeurs[d.id] = c.exemple; sauver(); render(false); },
    toutExemple: () => { const b = S.brouillon, p = PROMPT[b.promptId]; p.champs.forEach(c => { if (!(b.valeurs[c.id] || '').trim()) b.valeurs[c.id] = c.exemple; }); sauver(); render(false); },
    copierPrompt: (d, el) => { const b = S.brouillon; copier(promptTexte(PROMPT[b.promptId], b.valeurs), el); },
    copierRelance: (d, el) => copier(RELANCES[Number(d.i)], el),
    copierModele: (d, el) => copier(PROMPT[d.id].modele.replace(/\{\{(\w+)\}\}/g, (s, id) => { const c = PROMPT[d.id].champs.find(x => x.id === id); return '[' + (c ? c.label : id) + ']'; }), el),
    versVerifier: () => { const b = S.brouillon; b.etape = 4; b.etapeMax = Math.max(b.etapeMax || 0, 4); sauver(); render(true); },
    verif: d => { S.brouillon.verif[d.l] = d.v; sauver(); render(false); },
    controle: d => { const c = S.brouillon.controles; c[d.i] = !c[d.i]; sauver(); render(false); },
    utilise: d => { S.brouillon.utilise = d.v; sauver(); render(false); },
    enregistrerMission: () => {
      const b = S.brouillon, p = PROMPT[b.promptId];
      if (!VERIF.every(v => b.verif[v.l])) return;
      const ev = evaluer(b.checklist);
      S.missions.push({ id: Date.now(), promptId: p.id, titre: p.titre, domaine: p.domaine, date: new Date().toISOString(), verdict: ev.pire, niveau: b.checklist.niveau, outil: b.checklist.outil, verif: Object.assign({}, b.verif), verifComplet: true, controles: Object.keys(b.controles).filter(k => b.controles[k]).length, gain: Number(b.gain) || 0, utilise: b.utilise, note: b.note, entrainement: b.entrainement });
      b.etape = 5; b.etapeMax = 5; sauver(); toast('Mission enregistrée'); render(true);
    },
    ouvrirPrompt: d => { UI.prompts.ouvert = d.id; render(true); },
    fermerPrompt: () => { UI.prompts.ouvert = null; render(true); },
    favori: d => { const i = S.favoris.indexOf(d.id); if (i >= 0) S.favoris.splice(i, 1); else S.favoris.push(d.id); sauver(); render(false); },
    ongletEthique: d => { UI.ethique.onglet = d.o; if (UI.route !== 'ethique') aller('ethique'); else render(false); },
    enregistrerVerif: () => { const ev = evaluer(UI.ethique.reponses); if (!ev.complet) return; S.verifs.push({ date: new Date().toISOString(), verdict: ev.pire, niveau: UI.ethique.reponses.niveau, outil: UI.ethique.reponses.outil, pays: S.prefs.pays }); UI.ethique.enregistre = true; sauver(); toast('Vérification enregistrée'); render(false); },
    resetChecklist: () => { UI.ethique.reponses = {}; UI.ethique.enregistre = false; render(false); },
    exporter: () => { UI.prog.exportVisible = !UI.prog.exportVisible; render(false); },
    copierExport: (d, el) => copier(JSON.stringify(S), el),
    telechargerExport: () => telecharger('boussole-ia-progression-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 2)),
    importer: () => {
      try { const o = JSON.parse(UI.prog.importTexte); if (!o || o.v !== 1 || !Array.isArray(o.missions)) throw new Error('format'); UI.prog.confirmImport = true; UI.prog.erreurImport = ''; }
      catch (e) { UI.prog.erreurImport = 'Ce texte n\'est pas une sauvegarde Boussole IA valide. Vérifiez que vous avez copié l\'export en entier.'; }
      render(false);
    },
    confirmerImport: () => { S = Object.assign(etatVide(), JSON.parse(UI.prog.importTexte)); sauver(); UI.prog = { exportVisible: false, importTexte: '', confirmImport: false, confirmReset: false, erreurImport: '' }; toast('Progression importée'); render(true); },
    annulerImport: () => { UI.prog.confirmImport = false; render(false); },
    reset: () => { UI.prog.confirmReset = true; render(false); },
    confirmerReset: () => { S = etatVide(); sauver(); UI.prog.confirmReset = false; toast('Progression réinitialisée'); render(true); },
    annulerReset: () => { UI.prog.confirmReset = false; render(false); },
    imprimer: () => { try { window.print(); } catch (e) { } },
    fermerModale: () => { $('#modale').hidden = true; }
  };
  // « Je progresse » : exécute la prochaine étape recommandée
  A.suivant = () => { const nx = prochaineEtape(); const fn = A[nx.a]; if (fn) fn(nx); };

  // Saisie au clavier : mise à jour partielle pour conserver le focus
  const IN = {
    rechMission: el => { UI.mission.q = el.value; $('#liste-taches').innerHTML = listeTaches(); },
    rechPrompts: el => { UI.prompts.q = el.value; $('#grille-prompts').innerHTML = grillePrompts(); },
    rechPays: el => { UI.pays.q = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    champ: el => { const b = S.brouillon, p = PROMPT[b.promptId]; b.valeurs[el.dataset.id] = el.value; sauverPlusTard(); $('#apercu').innerHTML = apercuHTML(p, b.valeurs); $('#compte-champs').textContent = compteChamps(p, b); },
    note: el => { S.brouillon.note = el.value; sauverPlusTard(); },
    nom: el => { S.prefs.nom = el.value.trim(); sauverPlusTard(); },
    reec: el => { const st = UI.reecriture[el.dataset.id] || (UI.reecriture[el.dataset.id] = { texte: '', revele: false }); st.texte = el.value; $('#detection').innerHTML = detection(el.value); },
    importTexte: el => { UI.prog.importTexte = el.value; UI.prog.confirmImport = false; UI.prog.erreurImport = ''; const b = document.querySelector('[data-a="importer"]'); if (b) b.disabled = !el.value.trim(); }
  };
  const CH = {
    pays: el => { S.prefs.pays = el.value; sauver(); render(false); },
    gain: el => { S.brouillon.gain = el.value; sauver(); },
    regionPays: el => { UI.pays.region = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    statutPays: el => { UI.pays.statut = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    fichierImport: el => {
      const f = el.files && el.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => { UI.prog.importTexte = String(r.result || ''); UI.prog.erreurImport = ''; render(false); }; r.readAsText(f);
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const fn = A[el.dataset.a]; if (!fn) return;
    if (el.disabled) return;
    e.preventDefault(); fn(el.dataset, el, e);
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape' && !$('#modale').hidden) $('#modale').hidden = true;
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && IN[el.dataset.in]) IN[el.dataset.in](el); });
  document.addEventListener('change', e => { const el = e.target; if (el.dataset && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
  $('#modale').addEventListener('click', e => { if (e.target.id === 'modale') e.currentTarget.hidden = true; });

  // Polices de la charte : chargées sans bloquer l'affichage (repli système hors ligne)
  try {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap';
    document.head.appendChild(l);
  } catch (e) { }

  construireNav();
  UI.route = routeDuLien();
  render(false);
})();
</script>

</body>
</html>

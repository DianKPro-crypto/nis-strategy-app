<title>Boussole IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Boussole IA · Santé publique : préparer, protéger, produire et vérifier chaque usage de l'IA dans les missions de santé publique.">
<style>
/* Mise en page : rail de navigation à gauche sur ordinateur, barre d'onglets en bas sur mobile ;
   contenu en colonne de lecture, outils en grilles. Charte Dian K Pro : noir et or, Playfair Display + Inter. */
:root {
  --bg: #0B0B0C;
  --bg-voile: rgba(11, 11, 12, .86);
  --surface: #151517;
  --surface-2: #1D1D20;
  --line: #2C2B28;
  --line-strong: #45423B;
  --fg: #F5F2EB;
  --fg-2: #D6D0C4;
  --fg-3: #ABA497;
  --or: #E3B34C;
  --or-texte: #E8BC5C;
  --sur-or: #0B0B0C;
  --or-voile: rgba(227, 179, 76, .13);
  --or-bord: rgba(227, 179, 76, .45);
  --ok: #62C995;
  --ok-voile: rgba(98, 201, 149, .14);
  --att: #F2A65A;
  --att-voile: rgba(242, 166, 90, .15);
  --bloq: #F47C72;
  --bloq-voile: rgba(244, 124, 114, .15);
  --ombre: 0 18px 40px rgba(0, 0, 0, .35);
  --f-titre: "Playfair Display", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-texte: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --rayon: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F5F2; --bg-voile: rgba(245, 245, 242, .88); --surface: #FFFFFF; --surface-2: #EFEDE7;
    --line: #E1DDD3; --line-strong: #C9C2B2; --fg: #141413; --fg-2: #37342E; --fg-3: #5C574C;
    --or: #E3B34C; --or-texte: #85600F; --sur-or: #0B0B0C; --or-voile: rgba(227, 179, 76, .18); --or-bord: rgba(160, 118, 24, .45);
    --ok: #1C7A4E; --ok-voile: rgba(28, 122, 78, .1); --att: #A8520A; --att-voile: rgba(168, 82, 10, .1);
    --bloq: #B3261E; --bloq-voile: rgba(179, 38, 30, .09); --ombre: 0 14px 34px rgba(40, 32, 12, .1);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F5F2; --bg-voile: rgba(245, 245, 242, .88); --surface: #FFFFFF; --surface-2: #EFEDE7;
  --line: #E1DDD3; --line-strong: #C9C2B2; --fg: #141413; --fg-2: #37342E; --fg-3: #5C574C;
  --or: #E3B34C; --or-texte: #85600F; --sur-or: #0B0B0C; --or-voile: rgba(227, 179, 76, .18); --or-bord: rgba(160, 118, 24, .45);
  --ok: #1C7A4E; --ok-voile: rgba(28, 122, 78, .1); --att: #A8520A; --att-voile: rgba(168, 82, 10, .1);
  --bloq: #B3261E; --bloq-voile: rgba(179, 38, 30, .09); --ombre: 0 14px 34px rgba(40, 32, 12, .1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--f-texte); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--or-texte); }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

h1, h2 { font-family: var(--f-titre); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem); }
h1, h2, .porte-titre, .verdict-titre, .ck-bloc legend, .marque-nom { font-variant-numeric: lining-nums; }
.chiffre b, .score b, .module-num, .cinq-temps li::before { font-variant-numeric: lining-nums tabular-nums; }
h2 { font-size: clamp(1.35rem, 1.15rem + .8vw, 1.7rem); }
h3 { font-size: 1.1rem; font-weight: 650; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.surtitre { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--or-texte); font-weight: 650; }
.discret { color: var(--fg-3); font-size: .92rem; }
.chapeau { font-size: 1.12rem; color: var(--fg-2); max-width: 62ch; }
.pile { display: grid; gap: 16px; }
.pile-l { display: grid; gap: 28px; }
.rangee { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* --- Structure --- */
.app { min-height: 100vh; }
.nav { display: none; }
.barre-haut {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-voile); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.barre-haut .outils-haut { display: flex; gap: 6px; }
.btn-icone { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); text-decoration: none; cursor: pointer; }
.btn-icone.actif { color: var(--or-texte); border-color: var(--or-bord); }
.vue { max-width: 1120px; margin: 0 auto; padding-block: 24px 128px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.onglets a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; font-size: .74rem; font-weight: 550; color: var(--fg-3); text-decoration: none; }
.onglets a.actif { color: var(--or-texte); }
.onglets .ico { width: 22px; height: 22px; }

.marque { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.marque svg { width: 34px; height: 34px; }
.marque-nom { font-family: var(--f-titre); font-size: 1.22rem; font-weight: 700; line-height: 1; }
.marque-sous { display: block; font-family: var(--f-texte); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--or-texte); font-weight: 650; margin-top: 4px; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
  .barre-haut, .onglets { display: none; }
  .nav { display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 22px; border-right: 1px solid var(--line); background: var(--surface); }
  .nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .nav a.lien-nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--fg-2); text-decoration: none; font-weight: 520; font-size: .98rem; }
  .nav a.lien-nav:hover { background: var(--surface-2); color: var(--fg); }
  .nav a.lien-nav.actif { background: var(--or-voile); color: var(--or-texte); font-weight: 620; }
  .nav .sep { height: 1px; background: var(--line); margin: 10px 12px; }
  .nav-pied { margin-top: auto; font-size: .8rem; color: var(--fg-3); padding: 0 12px; display: grid; gap: 4px; }
  .vue { padding-block: 44px 88px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); }
}

/* --- Boutons et puces --- */
.btn, .btn-sec, .btn-lien { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; font-weight: 620; font-size: .98rem; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn { background: var(--or); color: var(--sur-or); border: 1px solid var(--or); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled], .btn-sec[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn-sec { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }
.btn-sec:hover { border-color: var(--or-bord); }
.btn-lien { background: none; border: 0; padding: 6px 4px; min-height: 0; color: var(--or-texte); font-weight: 600; }
.btn-lien:hover { text-decoration: underline; }
.btn.copie, .btn-sec.copie { background: var(--ok); border-color: var(--ok); color: var(--sur-or); }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--fg-2); font-size: .8rem; font-weight: 560; line-height: 1.5; white-space: nowrap; }
.puce.or { border-color: var(--or-bord); color: var(--or-texte); background: var(--or-voile); }
.puce.ok, .puce.N0 { border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); background: var(--ok-voile); }
.puce.N1 { border-color: var(--or-bord); color: var(--or-texte); background: var(--or-voile); }
.puce.att, .puce.N2 { border-color: color-mix(in srgb, var(--att) 50%, transparent); color: var(--att); background: var(--att-voile); }
.puce.bloq, .puce.N3 { border-color: color-mix(in srgb, var(--bloq) 50%, transparent); color: var(--bloq); background: var(--bloq-voile); }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .9rem; font-weight: 560; color: var(--fg-2); }
.filtre[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.recherche { width: 100%; max-width: 420px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); }
.recherche::placeholder, textarea::placeholder, input::placeholder { color: var(--fg-3); opacity: 1; }
.barre-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid var(--line); }
.retour { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); background: none; border: 0; cursor: pointer; padding: 4px 0; font-size: .92rem; font-weight: 560; }
.retour:hover { color: var(--fg); }

/* --- Panneaux --- */
.panneau { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rayon); padding: 22px; }
.panneau-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.grille { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.duo { display: grid; gap: 20px; align-items: start; }
@media (min-width: 860px) { .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.bandeau { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--att); background: var(--att-voile); color: var(--fg); font-size: .92rem; }

/* --- Accueil --- */
.hero { display: grid; gap: 14px; padding-bottom: 8px; }
.hero h1 { font-size: clamp(2.6rem, 1.8rem + 4vw, 4.2rem); }
.hero h1 em { font-style: normal; color: var(--or-texte); }
.portes { display: grid; gap: 14px; }
@media (min-width: 760px) { .portes { grid-template-columns: 1.25fr 1fr 1fr; } }
.porte { display: grid; align-content: start; gap: 10px; text-align: left; padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; transition: border-color .15s, transform .15s; }
.porte:hover { border-color: var(--or-bord); transform: translateY(-1px); }
.porte .ico { width: 26px; height: 26px; color: var(--or-texte); }
.porte-titre { font-family: var(--f-titre); font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.porte-texte { color: var(--fg-2); font-size: .95rem; }
.porte-cta { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: .92rem; color: var(--or-texte); margin-top: 4px; }
.porte-principale { background: var(--or); border-color: var(--or); color: var(--sur-or); }
.porte-principale .ico, .porte-principale .porte-cta, .porte-principale .porte-texte { color: var(--sur-or); }
.porte-principale:hover { border-color: var(--or); filter: brightness(1.05); }
.comp { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.comp:last-child { border-bottom: 0; padding-bottom: 0; }
.comp-tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
.jauge { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.jauge > span { position: absolute; inset: 0 auto 0 0; background: var(--or); border-radius: 99px; }
.jauge > i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.comp-desc { font-size: .86rem; color: var(--fg-3); }
.niv-Découverte { } .niv-Pratique { border-color: var(--or-bord); color: var(--or-texte); } .niv-Maîtrise { background: var(--or); color: var(--sur-or); border-color: var(--or); }
.chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chiffre { padding: 14px; border-radius: 12px; background: var(--surface-2); }
.chiffre b { display: block; font-family: var(--f-titre); font-size: 1.7rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.chiffre span { font-size: .84rem; color: var(--fg-3); }
.suivant { display: grid; gap: 8px; padding: 18px; border-radius: 14px; border: 1px solid var(--or-bord); background: var(--or-voile); }
.cinq-temps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); counter-reset: t; }
.cinq-temps li { counter-increment: t; padding: 16px; border-top: 2px solid var(--or); background: var(--surface); border-radius: 0 0 12px 12px; display: grid; gap: 4px; }
.cinq-temps li::before { content: "0" counter(t); font-family: var(--f-titre); color: var(--or-texte); font-size: 1.1rem; font-weight: 700; }
.cinq-temps b { font-size: 1.02rem; }
.cinq-temps span { font-size: .88rem; color: var(--fg-3); }

/* --- Mission --- */
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stepper li { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: .78rem; font-weight: 600; color: var(--fg-3); position: relative; }
.stepper li::after { content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--line); }
.stepper li:last-child::after { display: none; }
.stepper .rond { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); background: var(--bg); font-size: .9rem; color: var(--fg-2); }
.stepper li.fait .rond { background: var(--or-voile); border-color: var(--or); color: var(--or-texte); }
.stepper li.fait::after { background: var(--or-bord); }
.stepper li.actif { color: var(--fg); }
.stepper li.actif .rond { background: var(--or); border-color: var(--or); color: var(--sur-or); }
.stepper button { all: unset; display: grid; justify-items: center; gap: 6px; cursor: pointer; }
.stepper button:focus-visible { outline: 2px solid var(--or); outline-offset: 4px; border-radius: 8px; }
.tache-entete { display: grid; gap: 8px; padding: 18px 20px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--line); }
.taches { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.tache { display: grid; gap: 8px; text-align: left; padding: 18px; border-radius: var(--rayon); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); transition: border-color .15s; }
.tache:hover { border-color: var(--or-bord); }
.tache h3 { font-size: 1.04rem; }
.tache p { color: var(--fg-2); font-size: .92rem; }
.gain { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.gain .ico { width: 16px; height: 16px; }
.entrainement { padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line-strong); font-size: .9rem; color: var(--fg-2); }

/* Checklist */
.ck-grille { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1100px) { .ck-grille { grid-template-columns: minmax(0, 1fr) 360px; } .ck-grille .verdict { position: sticky; top: 24px; } }
.ck-bloc { border: 0; margin: 0; padding: 0; display: grid; gap: 14px; }
.ck-bloc legend { font-family: var(--f-titre); font-size: 1.25rem; font-weight: 600; padding: 0; margin-bottom: 4px; }
.ck-q { display: grid; gap: 10px; padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ck-q.repondu { border-color: var(--line-strong); }
.ck-q > p { font-weight: 560; }
.ck-indice { font-size: .85rem; color: var(--fg-3); }
.ck-opts { display: grid; gap: 8px; }
.ck-opts.cartes { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.ck-opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: .94rem; display: grid; gap: 3px; }
.ck-opt:hover { border-color: var(--or-bord); }
.ck-opt[aria-pressed="true"] { border-color: var(--or); background: var(--or-voile); }
.ck-opt b { font-weight: 650; }
.ck-opt small { color: var(--fg-3); font-size: .82rem; line-height: 1.45; }
.select { width: 100%; max-width: 420px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); }
.verdict { display: grid; gap: 14px; padding: 20px; border-radius: var(--rayon); border: 1px solid var(--line-strong); background: var(--surface); }
.verdict.v-ok { border-color: var(--ok); background: linear-gradient(var(--ok-voile), var(--ok-voile)), var(--surface); }
.verdict.v-attention { border-color: var(--att); background: linear-gradient(var(--att-voile), var(--att-voile)), var(--surface); }
.verdict.v-bloquant { border-color: var(--bloq); background: linear-gradient(var(--bloq-voile), var(--bloq-voile)), var(--surface); }
.verdict-tete { display: flex; gap: 14px; align-items: center; }
.feu { display: grid; gap: 5px; padding: 7px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); flex: none; }
.feu span { width: 14px; height: 14px; border-radius: 50%; background: var(--line-strong); opacity: .5; }
.v-bloquant .feu .r { background: var(--bloq); opacity: 1; box-shadow: 0 0 10px var(--bloq); }
.v-attention .feu .o { background: var(--att); opacity: 1; box-shadow: 0 0 10px var(--att); }
.v-ok .feu .v { background: var(--ok); opacity: 1; box-shadow: 0 0 10px var(--ok); }
.verdict-titre { font-family: var(--f-titre); font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.conseils { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conseils li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: .9rem; align-items: start; }
.conseils .pastille { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.pastille.ok { background: var(--ok); } .pastille.attention { background: var(--att); } .pastille.bloquant { background: var(--bloq); }
.pays-encart { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; }

/* Produire */
.produire { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1100px) { .produire { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } .col-prompt { position: sticky; top: 24px; } }
.champ { display: grid; gap: 6px; }
.champ label { font-weight: 600; font-size: .95rem; }
.champ input, .champ textarea, textarea.zone { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: .95rem; line-height: 1.5; }
.champ textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: .86rem; }

      (exos.length ? '<section class="pile"><h2>Exercices</h2><ol class="lecons">' + exos.map((ex, i) => { const id = ex.ref || ex.id; const fait = S.exercices[id]; const t = ex.titre || ERREUR[id].titre; return '<li class="' + (fait ? 'lue' : '') + '"><button data-a="ouvrirEx" data-m="' + m.id + '" data-id="' + id + '"><span class="etat">' + (fait ? ico('check') : i + 1) + '</span><span><b>' + esc(t) + '</b><br><span class="discret">' + (ex.type === 'erreurs' ? 'Trouvez l\'erreur' : 'Réécriture') + '</span></span><span class="discret">' + (fait ? Math.round(fait.score * 100) + ' %' : '') + '</span></button></li>'; }).join('') + '</ol></section>' : '') +
      ((m.quiz || []).length ? '<section class="pile"><h2>Quiz</h2><div class="score"><span>' + m.quiz.length + ' questions · ' + (S.quiz[m.id] !== undefined ? 'meilleur score ' + Math.round(S.quiz[m.id] * 100) + ' %' : 'pas encore tenté') + '</span><button class="btn" data-a="ouvrirQuiz" data-m="' + m.id + '">' + (S.quiz[m.id] !== undefined ? 'Refaire le quiz' : 'Commencer le quiz') + '</button></div></section>' : '') +

      '</div>';

  function vueLecon(l) {
    const m = l.module, prec = m.lecons[l.index - 1], suiv = m.lecons[l.index + 1];
    return '<article class="lecon"><button class="retour" data-a="ouvrirModule" data-m="' + m.id + '">' + ico('retour') + 'Module ' + m.num + ' · ' + esc(m.titre) + '</button>' +

  const DETECT = {

      if (Object.keys(rep).length === m.quiz.length) {
        const sc = m.quiz.filter((q, i) => rep[i] === q.bonne).length / m.quiz.length;
        if (S.quiz[m.id] === undefined || sc > S.quiz[m.id]) { S.quiz[m.id] = sc; sauver(); }
      }
      render(false);
    },
    recommencerQuiz: d => { UI.quizRep[d.m] = {}; render(true); },
    seg: d => { const s = UI.exSel[d.e] || (UI.exSel[d.e] = {}); s[d.i] = !s[d.i]; render(false); },
    verifierEx: d => {
      const e = ERREUR[d.e], sel = UI.exSel[d.e] || {};
      const errs = e.segments.map((s, i) => [s, i]).filter(x => x[0].err);
      const faux = e.segments.filter((s, i) => !s.err && sel[i]).length;
      const sc = Math.max(0, (errs.filter(x => sel[x[1]]).length - faux * 0.5) / errs.length);
      UI.exVerifie[d.e] = true;
      if (!S.exercices[d.e] || sc > S.exercices[d.e].score) { S.exercices[d.e] = { score: sc, competence: 'critique', date: new Date().toISOString() }; sauver(); }
      render(false);
    },
    recommencerEx: d => { UI.exSel[d.e] = {}; UI.exVerifie[d.e] = false; render(false); },
    revelerReec: d => {
      const st = UI.reecriture[d.id] || (UI.reecriture[d.id] = { texte: '', revele: false });
      if (st.revele) { A.ouvrirModule({ m: d.m }); return; }
      st.revele = true;
      const sc = CADRE.filter(c => DETECT[c.l].test(st.texte)).length / CADRE.length;
      if (!S.exercices[d.id] || sc > S.exercices[d.id].score) { S.exercices[d.id] = { score: sc, competence: 'prompt', date: new Date().toISOString() }; sauver(); }
      render(false);
    },
    suivant: () => {},
    filtreMission: d => { UI.mission.filtre = d.f; render(false); },
    filtrePrompts: d => { UI.prompts.filtre = d.f; render(false); },
    choisirTache: d => nouvelleMission(d.id, false),
    entrainement: d => nouvelleMission(d.id, true),
    demanderAbandon: () => { UI.mission.confirmAbandon = true; render(false); },
    annulerAbandon: () => { UI.mission.confirmAbandon = false; render(false); },
    abandon: () => { S.brouillon = null; UI.mission.confirmAbandon = false; sauver(); render(true); },
    nouvelleMission: () => { S.brouillon = null; sauver(); render(true); },
    etape: d => { const b = S.brouillon; if (!b) return; const n = Number(d.n); if (n <= (b.etapeMax || b.etape)) { b.etape = n; sauver(); render(true); } },
    ck: d => {
      const rep = d.ctx === 'mission' ? (S.brouillon && S.brouillon.checklist) : UI.ethique.reponses; if (!rep) return;
      rep[d.q] = (d.q === 'niveau' || d.q === 'outil') ? d.v : Number(d.v);
      if (d.ctx === 'ethique') UI.ethique.enregistre = false;
      sauver(); render(false);
    },
    versProduire: () => { const b = S.brouillon; const ev = evaluer(b.checklist); if (!ev.complet || ev.pire === 'bloquant') return; b.verdict = ev.pire; b.etape = 3; b.etapeMax = Math.max(b.etapeMax || 0, 3); sauver(); render(true); },
    exemple: d => { const b = S.brouillon, p = PROMPT[b.promptId], c = p.champs.find(x => x.id === d.id); b.valeurs[d.id] = c.exemple; sauver(); render(false); },
    toutExemple: () => { const b = S.brouillon, p = PROMPT[b.promptId]; p.champs.forEach(c => { if (!(b.valeurs[c.id] || '').trim()) b.valeurs[c.id] = c.exemple; }); sauver(); render(false); },
    copierPrompt: (d, el) => { const b = S.brouillon; copier(promptTexte(PROMPT[b.promptId], b.valeurs), el); },
    copierRelance: (d, el) => copier(RELANCES[Number(d.i)], el),
    copierModele: (d, el) => copier(PROMPT[d.id].modele.replace(/\{\{(\w+)\}\}/g, (s, id) => { const c = PROMPT[d.id].champs.find(x => x.id === id); return '[' + (c ? c.label : id) + ']'; }), el),
    versVerifier: () => { const b = S.brouillon; b.etape = 4; b.etapeMax = Math.max(b.etapeMax || 0, 4); sauver(); render(true); },
    verif: d => { S.brouillon.verif[d.l] = d.v; sauver(); render(false); },
    controle: d => { const c = S.brouillon.controles; c[d.i] = !c[d.i]; sauver(); render(false); },
    utilise: d => { S.brouillon.utilise = d.v; sauver(); render(false); },
    enregistrerMission: () => {
      const b = S.brouillon, p = PROMPT[b.promptId];
      if (!VERIF.every(v => b.verif[v.l])) return;
      const ev = evaluer(b.checklist);
      S.missions.push({ id: Date.now(), promptId: p.id, titre: p.titre, domaine: p.domaine, date: new Date().toISOString(), verdict: ev.pire, niveau: b.checklist.niveau, outil: b.checklist.outil, verif: Object.assign({}, b.verif), verifComplet: true, controles: Object.keys(b.controles).filter(k => b.controles[k]).length, gain: Number(b.gain) || 0, utilise: b.utilise, note: b.note, entrainement: b.entrainement });
      b.etape = 5; b.etapeMax = 5; sauver(); toast('Mission enregistrée'); render(true);
    },
    ouvrirPrompt: d => { UI.prompts.ouvert = d.id; render(true); },
    fermerPrompt: () => { UI.prompts.ouvert = null; render(true); },
    favori: d => { const i = S.favoris.indexOf(d.id); if (i >= 0) S.favoris.splice(i, 1); else S.favoris.push(d.id); sauver(); render(false); },
    ongletEthique: d => { UI.ethique.onglet = d.o; if (UI.route !== 'ethique') aller('ethique'); else render(false); },
    enregistrerVerif: () => { const ev = evaluer(UI.ethique.reponses); if (!ev.complet) return; S.verifs.push({ date: new Date().toISOString(), verdict: ev.pire, niveau: UI.ethique.reponses.niveau, outil: UI.ethique.reponses.outil, pays: S.prefs.pays }); UI.ethique.enregistre = true; sauver(); toast('Vérification enregistrée'); render(false); },
    resetChecklist: () => { UI.ethique.reponses = {}; UI.ethique.enregistre = false; render(false); },
    exporter: () => { UI.prog.exportVisible = !UI.prog.exportVisible; render(false); },
    copierExport: (d, el) => copier(JSON.stringify(S), el),
    telechargerExport: () => telecharger('boussole-ia-progression-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 2)),
    importer: () => {
      try { const o = JSON.parse(UI.prog.importTexte); if (!o || o.v !== 1 || !Array.isArray(o.missions)) throw new Error('format'); UI.prog.confirmImport = true; UI.prog.erreurImport = ''; }
      catch (e) { UI.prog.erreurImport = 'Ce texte n\'est pas une sauvegarde Boussole IA valide. Vérifiez que vous avez copié l\'export en entier.'; }
      render(false);
    },
    confirmerImport: () => { S = Object.assign(etatVide(), JSON.parse(UI.prog.importTexte)); sauver(); UI.prog = { exportVisible: false, importTexte: '', confirmImport: false, confirmReset: false, erreurImport: '' }; toast('Progression importée'); render(true); },
    annulerImport: () => { UI.prog.confirmImport = false; render(false); },
    reset: () => { UI.prog.confirmReset = true; render(false); },
    confirmerReset: () => { S = etatVide(); sauver(); UI.prog.confirmReset = false; toast('Progression réinitialisée'); render(true); },
    annulerReset: () => { UI.prog.confirmReset = false; render(false); },
    imprimer: () => { try { window.print(); } catch (e) { } },
    fermerModale: () => { $('#modale').hidden = true; }
  };
  // « Je progresse » : exécute la prochaine étape recommandée
  A.suivant = () => { const nx = prochaineEtape(); const fn = A[nx.a]; if (fn) fn(nx); };

  // Saisie au clavier : mise à jour partielle pour conserver le focus
  const IN = {
    rechMission: el => { UI.mission.q = el.value; $('#liste-taches').innerHTML = listeTaches(); },
    rechPrompts: el => { UI.prompts.q = el.value; $('#grille-prompts').innerHTML = grillePrompts(); },
    rechPays: el => { UI.pays.q = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    champ: el => { const b = S.brouillon, p = PROMPT[b.promptId]; b.valeurs[el.dataset.id] = el.value; sauverPlusTard(); $('#apercu').innerHTML = apercuHTML(p, b.valeurs); $('#compte-champs').textContent = compteChamps(p, b); },
    note: el => { S.brouillon.note = el.value; sauverPlusTard(); },
    reec: el => { const st = UI.reecriture[el.dataset.id] || (UI.reecriture[el.dataset.id] = { texte: '', revele: false }); st.texte = el.value; $('#detection').innerHTML = detection(el.value); },
    importTexte: el => { UI.prog.importTexte = el.value; UI.prog.confirmImport = false; UI.prog.erreurImport = ''; const b = document.querySelector('[data-a="importer"]'); if (b) b.disabled = !el.value.trim(); }
  };
  const CH = {
    pays: el => { S.prefs.pays = el.value; sauver(); render(false); },
    gain: el => { S.brouillon.gain = el.value; sauver(); },
    regionPays: el => { UI.pays.region = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    statutPays: el => { UI.pays.statut = el.value; $('#lignes-pays').innerHTML = lignesPays(); },
    fichierImport: el => {
      const f = el.files && el.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => { UI.prog.importTexte = String(r.result || ''); UI.prog.erreurImport = ''; render(false); }; r.readAsText(f);
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const fn = A[el.dataset.a]; if (!fn) return;
    if (el.disabled) return;
    e.preventDefault(); fn(el.dataset, el, e);
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape' && !$('#modale').hidden) $('#modale').hidden = true;
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && IN[el.dataset.in]) IN[el.dataset.in](el); });
  document.addEventListener('change', e => { const el = e.target; if (el.dataset && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
  $('#modale').addEventListener('click', e => { if (e.target.id === 'modale') e.currentTarget.hidden = true; });

  // Polices de la charte : chargées sans bloquer l'affichage (repli système hors ligne)
  try {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap';
    document.head.appendChild(l);
  } catch (e) { }

  construireNav();
  UI.route = routeDuLien();
  render(false);
})();
</script>
